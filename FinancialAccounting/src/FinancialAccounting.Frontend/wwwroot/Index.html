<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Личные финансы</title>
    <link rel="icon" href="favicon.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f0f2f5;
            color: #1a1a1a;
        }

        .app-wrapper {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            width: 320px;
            min-width: 320px;
            background: #fff;
            border-right: 1px solid #e0e0e0;
            padding: 20px;
            height: 100vh;
            overflow-y: auto; 
            display: flex;
            flex-direction: column;
        }

            #sidebar::-webkit-scrollbar {
                width: 6px;
            }

            #sidebar::-webkit-scrollbar-thumb {
                background: #eee;
                border-radius: 10px;
            }

                #sidebar::-webkit-scrollbar-thumb:hover {
                    background: #ddd;
                }

        .section-title {
            font-size: 0.9rem;
            color: #65676b;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 20px 0 10px;
        }

        .card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

            .card:hover {
                border-color: #0084ff;
                background: #f7faff;
            }

        .card-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
        }

        .balance {
            color: #0084ff;
        }

        #main-content {
            flex-grow: 1;
            padding: 40px;
            overflow-y: auto;
            display: flex;
            justify-content: center;
        }

        #details-area {
            width: 100%;
            max-width: 600px;
        }

        .tr-item {
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f0f2f5;
        }

        .tr-amount-pos {
            color: #28a745;
            font-weight: bold;
        }

        .tr-amount-neg {
            color: #dc3545;
            font-weight: bold;
        }

        .form-card {
            background: #fff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .type-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .type-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
        }

        input[type="radio"] {
            display: none;
        }

        #type-exp:checked + label {
            border-color: #dc3545;
            color: #dc3545;
            background: #fff5f5;
        }

        #type-inc:checked + label {
            border-color: #28a745;
            color: #28a745;
            background: #f1fdf7;
        }

        input[type="number"], input[type="text"], select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: #0084ff;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

            .btn-submit:hover {
                background: #0073e6;
            }

        .tr-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .tr-desc {
            font-size: 0.85rem;
            color: #65676b;
            font-style: italic;
        }

        .tr-item {
            position: relative;
        }

        .btn-delete {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: #ccc;
            cursor: pointer;
            font-size: 1.2rem;
            line-height: 1;
            padding: 5px;
            transition: 0.2s;
        }

            .btn-delete:hover {
                color: #dc3545;
                transform: scale(1.2);
            }

        .btn-edit {
            background: none;
            border: none;
            color: #0084ff;
            cursor: pointer;
            font-size: 1.2rem;
            margin-left: 10px;
            padding: 5px;
            vertical-align: middle;
            transition: 0.2s;
        }

            .btn-edit:hover {
                color: #0056b3;
                transform: scale(1.1);
            }

        .edit-input {
            font-size: 2rem;
            font-weight: bold;
            border: 1px solid #0084ff;
            border-radius: 8px;
            padding: 2px 10px;
            width: 400px;
        }

        #account-title-container {
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 60px;
        }

        .edit-group {
            display: flex;
            align-items: center;
            gap: 8px; 
            height: 100%;
        }

        .btn-edit {
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            padding: 0;
            margin: 0;
            cursor: pointer;
            line-height: 1; 
        }

        .edit-input {
            font-size: 2rem;
            font-weight: bold;
            border: 2px solid #0084ff;
            border-radius: 8px;
            padding: 4px 12px;
            line-height: 1.2; 
            outline: none;
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        .btn-more {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #888;
            cursor: pointer;
            padding: 0 10px;
            line-height: 1;
            transition: 0.2s;
        }

            .btn-more:hover {
                color: #333;
            }

        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            background-color: white;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.1);
            z-index: 10;
            border-radius: 8px;
            border: 1px solid #eee;
            overflow: hidden;
        }

            .dropdown-content button {
                width: 100%;
                padding: 12px 16px;
                border: none;
                background: none;
                text-align: left;
                cursor: pointer;
                color: #dc3545; 
                font-weight: bold;
            }

                .dropdown-content button:hover {
                    background-color: #fff5f5;
                }

        .show {
            display: block;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0 10px;
        }

        .btn-add-section {
            background: #e7f3ff;
            color: #0084ff;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

            .btn-add-section:hover {
                background: #0084ff;
                color: white;
            }

        .progress-container {
            width: 100%;
            height: 6px;
            background: #eef0f2;
            border-radius: 10px;
            margin-top: 12px;
            overflow: hidden; 
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #0084ff, #00c6ff); 
            transition: width 0.5s ease-in-out;
        }

        .target-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-inline-add {
            background: #f0f2f5;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px 15px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

            .btn-inline-add:hover {
                background: #0084ff;
                color: white;
                border-color: #0084ff;
            }

        .input-row {
            display: flex !important;
            flex-direction: row !important;
            gap: 8px !important;
            align-items: stretch !important; 
            margin-bottom: 15px;
        }

        #category-select {
            flex-grow: 1 !important; 
            margin-bottom: 0 !important; 
        }

        .btn-inline-add {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px; 
            background: #e7f3ff;
            color: #0084ff;
            border: 1px solid #cce4ff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.5rem;
            padding: 0;
            flex-shrink: 0;
        }

            .btn-inline-add:hover {
                background: #0084ff;
                color: white;
            }

        .btn-inline-del {
            background: #fff5f5 !important;
            color: #dc3545 !important;
            border: 1px solid #ffc1c1 !important;
            border-radius: 8px !important;
            width: 45px;
            height: 45px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

            .btn-inline-del:hover {
                background: #dc3545 !important;
                color: white !important;
            }

        .target-card-wrapper {
            position: relative;
        }

        .btn-delete-target {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: #ccc;
            cursor: pointer;
            font-size: 1.3rem;
            transition: 0.2s;
        }

            .btn-delete-target:hover {
                color: #dc3545;
                transform: scale(1.1);
            }

        .target-card-wrapper {
            position: relative !important;
            padding-top: 40px !important; 
        }

        .btn-delete-target {
            position: absolute !important;
            top: 15px !important;
            right: 15px !important;
            background: none !important;
            border: none !important;
            color: #dc3545 !important; 
            cursor: pointer !important;
            font-size: 1.4rem !important;
            padding: 5px !important;
            z-index: 10 !important;
            transition: 0.2s;
        }

            .btn-delete-target:hover {
                color: #a71d2a !important;
                transform: scale(1.2);
            }

        .tr-item {
            position: relative;
        }

        .btn-delete-small {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: #ccc;
            cursor: pointer;
            font-size: 1.1rem;
            line-height: 1;
            padding: 5px;
            transition: 0.2s;
        }

            .btn-delete-small:hover {
                color: #dc3545;
                transform: scale(1.2);
            }

        #type-dep-inc:checked + label {
            background-color: #f1fdf7 !important;
            border-color: #28a745 !important;
            color: #28a745 !important;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(40, 167, 69, 0.2);
        }

        #type-dep-exp:checked + label {
            background-color: #fff5f5 !important;
            border-color: #dc3545 !important;
            color: #dc3545 !important;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(220, 53, 69, 0.2);
        }

        .type-btn {
            transition: all 0.2s ease;
            border: 2px solid #eee;
        }

        #type-dep-inc:checked + label {
            background-color: #f1fdf7 !important; 
            border-color: #28a745 !important;
            color: #28a745 !important;
            font-weight: bold;
        }

        #type-dep-exp:checked + label {
            background-color: #fff5f5 !important; 
            border-color: #dc3545 !important;
            color: #dc3545 !important;
            font-weight: bold;
        }

        .type-btn:hover {
            background-color: #f8f9fa;
            border-color: #ddd;
        }

        .total-balance-card {
            background: linear-gradient(135deg, #0084ff, #0056b3) !important;
            color: white !important;
            border: none !important;
            margin-bottom: 20px !important;
            padding: 20px !important;
        }

            .total-balance-card .balance {
                color: white !important;
                font-size: 1.4rem;
            }

            .total-balance-card:hover {
                transform: scale(1.02);
                box-shadow: 0 4px 15px rgba(0, 132, 255, 0.3) !important;
            }

        .chart-container {
            height: 35px;
            display: flex; 
            border-radius: 12px;
            overflow: hidden;
            background: #f0f2f5;
            margin: 20px 0;
            width: 100%; 
        }

        .chart-segment {
            height: 100%;
            transition: width 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .filter-box {
            display: flex;
            gap: 10px;
            background: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            align-items: center;
            border: 1px solid #efefef;
        }

            .filter-box select {
                padding: 8px 12px;
                border-radius: 8px;
                border: 1px solid #ddd;
                outline: none;
                cursor: pointer;
            }

        .inline-filter {
            display: flex;
            align-items: center;
            gap: 8px;
        }

            .inline-filter select {
                padding: 2px 8px;
                border-radius: 6px;
                border: 1px solid #ddd;
                background: #f8f9fa;
                font-size: 0.85rem;
                cursor: pointer;
                color: #4a5568;
            }

                .inline-filter select:hover {
                    border-color: #0084ff;
                }

        .history-header {
            display: flex;
            align-items: center; 
            gap: 15px; 
            margin-bottom: 20px;
            margin-top: 10px;
        }

            .history-header h4 {
                margin: 0;
                white-space: nowrap; 
            }

        
        .select-inline {
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid #ddd;
            background: #fff;
            font-size: 0.9rem;
            cursor: pointer;
            outline: none;
        }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <aside id="sidebar">
            <h2 style="font-size: 1.2rem; margin-bottom: 20px;">Личные финансы</h2>

            <div id="total-balance-container"></div>

            <div class="section-header">
                <div class="section-title" style="margin:0;">Счета</div>
                <button class="btn-add-section" onclick="showCreateAccountForm()" title="Добавить счет">+</button>
            </div>
            <div id="accounts-list"></div>

            <div class="section-header">
                <div class="section-title" style="margin:0;">Копилки</div>
                <button class="btn-add-section" onclick="showCreateTargetForm()">+</button>
            </div>
            <div id="targets-list"></div>
        </aside>

        <main id="main-content">
            <div id="details-area">
                <div style="text-align: center; color: #888; margin-top: 100px;">
                    <h2>Добро пожаловать</h2>
                    <p>Выберите счет слева, чтобы начать</p>
                </div>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
